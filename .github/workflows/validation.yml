# Validation des données : la CI refuse toute donnée sans source valide.
#
# 1. « donnees » (chaque pull request et chaque push sur main) :
#    schémas Zod + contrôles croisés entre fichiers, tests, types, construction complète du site.
# 2. « robot » : tests du robot de collecte (sans réseau).
# 3. « archives » (pull requests seulement) :
#    vérifie en ligne que la copie Wayback Machine de chaque source ajoutée ou modifiée existe vraiment.
#
# Aucun secret n'est utilisé : ces vérifications tournent aussi sur les contributions venant de forks.
name: Validation des données

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  donnees:
    name: Sources et données
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider les données (schémas + contrôles croisés)
        run: npm run valider

      - name: Tests
        run: npm test

      - name: Vérifier les types (scripts et schémas)
        run: npm run verifier:types

      - name: Vérifier les types (pages)
        run: npx nuxt typecheck

      - name: Construire le site
        run: npm run generate

  archives:
    name: Archives des sources modifiées
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt (avec l'historique, pour comparer à la branche cible)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts : seul le script de vérification est nécessaire ici.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Lister les sources ajoutées ou modifiées
        id: modifiees
        env:
          BRANCHE_CIBLE: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames --diff-filter=AM "origin/${BRANCHE_CIBLE}...HEAD" -- 'donnees/sources/*.json' > sources-modifiees.txt
          echo "nombre=$(grep -c . sources-modifiees.txt || true)" >> "$GITHUB_OUTPUT"
          echo "Sources à vérifier :"
          cat sources-modifiees.txt

      - name: Vérifier que chaque archive existe
        if: steps.modifiees.outputs.nombre != '0'
        run: xargs -a sources-modifiees.txt npx tsx scripts/verifier-archives.ts

  robot:
    name: Tests du robot de collecte
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt

      - name: Installer les dépendances du robot
        run: pip install -r robot/requirements.txt

      - name: Tests (aucun site réel n'est contacté)
        working-directory: robot
        run: python -m unittest -v
